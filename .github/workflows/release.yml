name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Install 7z
        run: apt-get update -qq && apt-get install -y p7zip-full

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Update devkitPro toolchain
        run: dkp-pacman -Syu --noconfirm

      - name: Build libnx 4.12.0
        run: |
          git clone --depth 1 --branch v4.12.0 https://github.com/switchbrew/libnx.git "$RUNNER_TEMP/libnx"
          test "$(git -C "$RUNNER_TEMP/libnx" rev-parse HEAD)" = "7644c9b26099aa2d2145bc72a21ee24190e92085"
          make -C "$RUNNER_TEMP/libnx" -j"$(nproc)"
          make -C "$RUNNER_TEMP/libnx" install
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version

      - name: Check translations
        run: python3 scripts/check_translation_lengths.py

      - name: Build distribution package
        run: make -j"$(nproc)"
          mkdir -p dist/sd-root/switch/.overlays dist/sd-root/config/ryazhahand/ovlSysmodules/lang
          cp ovlSysmodules.ovl dist/sd-root/switch/.overlays/
          cp lang/ru.json dist/sd-root/config/ryazhahand/ovlSysmodules/lang/
          cd dist/sd-root
          7z a ../ovlSysmodules.zip ./switch ./config

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ovlSysmodules
          path: dist/ovlSysmodules.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ovlSysmodules

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ovlSysmodules ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body: |
            Обновлена libryazhahand. Компактный текст и элементы в оверлее.
          files: ovlSysmodules.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
